name: llmplat

x-s3-env: &s3-env
  AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
  AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
  AWS_DEFAULT_REGION: us-east-1
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mlflow
    volumes: [pg-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow"]
      interval: 5s
      retries: 20

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command: >
      server -dir=/data -s3 -s3.port=8333
      -s3.config=/etc/seaweedfs/s3.json
      -master.volumeSizeLimitMB=1024
    volumes:
      - seaweed-data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    ports: ["8333:8333"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9333/cluster/status >/dev/null || exit 1"]
      interval: 5s
      retries: 30

  bucket-init:
    image: amazon/aws-cli:latest
    depends_on:
      seaweedfs: { condition: service_healthy }
    environment: *s3-env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        for i in $$(seq 1 30); do
          for b in mlflow dvc; do
            aws --endpoint-url http://seaweedfs:8333 s3 mb s3://$$b >/dev/null 2>&1 || true;
          done;
          if aws --endpoint-url http://seaweedfs:8333 s3 ls | grep -q ' dvc$$' &&
             aws --endpoint-url http://seaweedfs:8333 s3 ls | grep -q ' mlflow$$'; then
            echo buckets-ready; exit 0;
          fi;
          sleep 2;
        done; echo buckets-failed; exit 1

  mlflow:
    build: ./mlflow
    depends_on:
      postgres: { condition: service_healthy }
      bucket-init: { condition: service_completed_successfully }
    environment:
      <<: *s3-env
      MLFLOW_S3_ENDPOINT_URL: http://seaweedfs:8333
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql://mlflow:${POSTGRES_PASSWORD}@postgres:5432/mlflow
      --artifacts-destination s3://mlflow/
      --serve-artifacts
      --allowed-hosts "localhost:*,127.0.0.1:*,mlflow:*,mlflow.llmplat.orb.local:*"
    ports: ["5000:5000"]

  kind-registry:
    image: registry:3
    ports: ["127.0.0.1:5001:5000"]
    volumes: [registry-data:/var/lib/registry]

volumes:
  pg-data:
  seaweed-data:
  registry-data:
